<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;

      min-height: 100vh;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;

    header {
      margin-bottom: 30px;

    }

      border-color: var(--accent);
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);

      font-weight: 800;

    }

      filter: brightness(1.08);

</head>

<body>
  <main class="wrap">

    <header>
      <div class="eyebrow">Student services · Demo application</div>

      <h1>Student Portal</h1>

      <p>
        Register students and look up records using the Python API.
      </p>

      <div class="status">
        <span class="dot"></span>
        Frontend served by Nginx
      </div>
    </header>

    <section class="grid">

      <article class="card">
        <h2>Register a student</h2>

        <form id="registerForm">
          <label for="regNo">Registration number</label>
          <input
            id="regNo"
            required
            placeholder="e.g. SRM2026001"
          >

          <label for="studentName">Full name</label>
          <input
            id="studentName"
            required
            placeholder="Student name"
          >

          <label for="age">Age</label>
          <input
            id="age"
            type="number"
            min="1"
            max="120"
            required
            placeholder="21"
          >

          <button type="submit">Register student</button>
        </form>

        <div id="registerResult" class="result" role="status"></div>
      </article>

      <article class="card">
        <h2>Find a student</h2>

        <form id="searchForm">
          <label for="searchRegNo">Registration number</label>
          <input
            id="searchRegNo"
            required
            placeholder="Enter registration number"
          >

          <button type="submit">Search record</button>
        </form>

        <div id="searchResult" class="result" aria-live="polite"></div>
      </article>

    </section>

    <footer>
      Learning project · Nginx + Flask + MariaDB · Docker Compose
    </footer>

  </main>

  <script>
    const registerForm = document.getElementById("registerForm");
    const registerResult = document.getElementById("registerResult");
    const searchForm = document.getElementById("searchForm");
    const searchResult = document.getElementById("searchResult");

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      registerResult.textContent = "Submitting…";

      const payload = {
        reg_no: document.getElementById("regNo").value.trim(),
        name: document.getElementById("studentName").value.trim(),
        age: Number(document.getElementById("age").value)
      };

      try {
        const response = await fetch("/api/students", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Registration failed");
        }

        registerResult.textContent =
          `Success: ${data.message} (ID ${data.id})`;

        registerForm.reset();

      } catch (error) {
        registerResult.textContent = error.message;
      }
    });

    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      searchResult.textContent = "Searching…";

      const regNo =
        document.getElementById("searchRegNo").value.trim();

      try {
        const response = await fetch(
          `/api/students?reg_no=${encodeURIComponent(regNo)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Search failed");
        }

        searchResult.innerHTML = "";

        const card = document.createElement("div");
        card.className = "student";

        card.textContent =
          `Registration: ${data.reg_no} | ` +
          `Name: ${data.name} | Age: ${data.age}`;

        searchResult.appendChild(card);

      } catch (error) {
        searchResult.textContent = error.message;
      }
    });
  </script>
</body>
</html>
